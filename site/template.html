<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Aduoer UVR 本地人声与伴奏分离：真机性能对比、音频试听和 Swift 接入说明。">
  <title>Aduoer UVR · 在线试听</title>
  <style>
    :root{color-scheme:light;--bg:#f7f8fb;--panel:#fff;--text:#19232f;--muted:#627081;--line:#e2e7ef;--accent:#1664d9;--code:#edf1f7}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    a{color:var(--accent);text-underline-offset:3px}a:hover{text-decoration-thickness:2px}
    nav{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;max-width:1080px;margin:auto;padding:24px}
    nav strong{letter-spacing:.03em}nav div{display:flex;gap:20px}
    main{max-width:1080px;margin:0 auto 56px;padding:28px 32px 40px;background:var(--panel);border:1px solid var(--line);border-radius:20px}
    h1{font-size:clamp(2rem,5vw,3rem);line-height:1.2;letter-spacing:-.04em;margin:10px 0 24px}
    h2{font-size:1.5rem;margin:40px 0 18px;border-top:1px solid var(--line);padding-top:24px;scroll-margin-top:24px}
    h3{font-size:1.1rem;margin:0}p{margin:16px 0}code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em;background:var(--code);padding:.15em .35em;border-radius:5px}
    pre{background:var(--code);padding:20px;border-radius:12px;overflow:auto;font-size:.92em;line-height:1.6}pre code{padding:0}
    table{display:block;overflow:auto;border-collapse:collapse;margin:20px 0;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
    th,td{padding:12px 14px;border:1px solid var(--line);text-align:left;white-space:nowrap}th{background:var(--bg)}
    .listening-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin:20px 0}
    .song{min-width:0;padding:20px;background:var(--bg);border:1px solid var(--line);border-radius:16px}
    .song-heading{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:20px}
    button{font:inherit;font-size:.8rem;white-space:nowrap;background:var(--panel);color:var(--text);border:1px solid var(--line);padding:7px 10px;border-radius:8px;cursor:pointer}
    button:hover{border-color:var(--accent)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    .track{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:18px 0}.track span{font-weight:600;font-size:.9rem}.track a{font-size:.8rem}
    audio{grid-column:1/-1;grid-row:2;width:100%;height:42px}.track a{grid-column:2;grid-row:1}
    footer{color:var(--muted);max-width:1080px;margin:0 auto 32px;padding:0 24px;font-size:.85rem}
    @media(max-width:720px){main{border-radius:0;border-left:0;border-right:0;padding:24px 18px}.listening-grid{grid-template-columns:1fr}nav{padding:18px}nav div{gap:14px}.song{padding:16px}}
    @media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#121821;--panel:#1b2430;--text:#edf2f9;--muted:#a6b2c1;--line:#303e50;--accent:#88bbff;--code:#253142}}
  </style>
</head>
<body>
  <nav aria-label="页面导航"><strong>ADUOER / UVR</strong><div><a href="#试听">试听</a><a href="#真机对比">真机对比</a><a href="https://github.com/Aduoer-Music/aduoer-uvr">GitHub ↗</a></div></nav>
  <main>{{CONTENT}}</main>
  <footer>页面内容与项目 README 同步，由 GitHub Actions 自动部署。</footer>
  <script>
    let active = null;
    document.querySelectorAll('audio').forEach(audio => {
      audio.addEventListener('play', () => {
        const previous = active;
        if (previous && previous !== audio) {
          const sameSong = previous.closest('.song') === audio.closest('.song');
          const time = previous.ended ? 0 : previous.currentTime;
          previous.pause();
          if (sameSong && Number.isFinite(audio.duration)) {
            audio.currentTime = Math.min(time, Math.max(0, audio.duration - 0.05));
          }
        }
        active = audio;
      });
      audio.addEventListener('error', () => {
        const track = audio.closest('.track');
        if (!track.querySelector('[role="status"]')) {
          const status = document.createElement('span');
          status.setAttribute('role', 'status');
          status.textContent = '音频加载失败，请刷新页面或下载试听。';
          track.append(status);
        }
      });
    });
    document.querySelectorAll('[data-restart]').forEach(button => {
      button.addEventListener('click', () => {
        button.closest('.song').querySelectorAll('audio').forEach(audio => {
          audio.pause();
          if (audio.readyState > 0) audio.currentTime = 0;
          if (active === audio) active = null;
        });
      });
    });
  </script>
</body>
</html>
