name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift test -c release
      # Actual model/oracle tests are opt-in after local weight conversion.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q tools
